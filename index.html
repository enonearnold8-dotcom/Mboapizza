<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mboa Pizza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Commandez vos pizzas et jus naturels en ligne : livraison à Douala et Yaoundé, paiement à la livraison ou Mobile Money, commande sur WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : en-tête sombre + pages qui changent selon le bouton choisi (#accueil, #menu, #panier, #offres, #plus) */
:root{
  --red:#e3262b; --red-d:#b81d22; --red-l:#fde8e8;
  --dark:#111111; --dark2:#1b1b1b;
  --green:#7cb342; --gold:#f5b81c; --wa:#25d366;
  --bg:#f6f5f3; --card:#ffffff; --text:#151515; --muted:#6b6b6b; --line:#e9e6e2;
  --radius:18px; --shadow:0 6px 24px rgba(0,0,0,.08);
  --display:"Bebas Neue",Impact,"Arial Narrow Bold","Arial Narrow",sans-serif;
  --script:"Caveat","Brush Script MT",cursive;
  --body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--dark)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* En-tête */
.top{background:var(--dark);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;position:relative;color:#fff;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn svg{width:24px;height:24px}
.badge{position:absolute;top:3px;right:2px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--dark);line-height:1}
.badge[hidden],.search-row[hidden]{display:none}
.top .badge{min-width:21px;height:21px;font-size:12px;top:1px;right:0}
.badge.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo svg{width:38px;height:38px;flex:none}
.logo img{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(245,184,28,.35)}
.logo small{font-family:var(--script);font-size:15px!important;letter-spacing:0!important;font-weight:700!important;color:var(--gold)!important;text-transform:none}
.foot-logo{width:110px;height:110px;border-radius:50%;margin-bottom:10px}
.logo b{display:block;white-space:nowrap;font-family:var(--display);font-size:26px;line-height:.9;letter-spacing:.5px;font-weight:400}
.logo b{color:var(--gold)}
.logo b span{color:#fff}
.logo small{display:block;white-space:nowrap;font-size:7.5px;letter-spacing:1px;font-weight:600;color:#cfcfcf;margin-top:2px}
.nav-links{display:none;gap:2px}
.nav-links a{padding:8px 14px;border-radius:10px;font-weight:500;color:#ccc}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav-links a.on{color:#fff;background:var(--red)}
.search-row{display:flex;gap:10px;padding:2px 0 14px}
.search{flex:1;position:relative}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:#aaa}
.search input{width:100%;height:46px;border-radius:24px;border:1px solid #3a3a3a;background:#1d1d1d;color:#fff;padding:0 16px 0 44px;font-size:15px}
.search input::placeholder{color:#9a9a9a}
.search input:focus{outline:none;border-color:var(--red)}
.filter-btn{width:46px;height:46px;border-radius:50%;border:1px solid #3a3a3a;background:#1d1d1d;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.filter-btn svg{width:20px;height:20px}

/* Pages */
#app{min-height:60vh}
.page{animation:pageIn .35s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.page-head{background:var(--dark);color:#fff;padding-block:6px 30px}
.page-head .crumbs{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:#262626;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.back svg{width:20px;height:20px}
.page-head h1{font-family:var(--display);font-weight:400;font-size:44px;line-height:1;letter-spacing:.5px}
.page-head h1 span{color:var(--red)}
.page-head p{color:#cfcfcf;font-size:14px;margin-top:4px}
.sheetwrap{background:var(--bg);border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:5;padding-top:20px}
section{padding-block:10px 18px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.sec-head h2{font-size:20px;font-weight:700}
.sec-head a{color:var(--red);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}

/* Bannière */
.hero{background:var(--dark);color:#fff;overflow:hidden;position:relative}
.slides{display:flex;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.slide{min-width:100%;position:relative;min-height:330px;display:flex;align-items:center;padding-block:24px 50px}
.slide-photo{position:absolute;top:0;right:0;bottom:0;width:72%;background-size:cover;background-position:center}
.slide-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#111 0%,rgba(17,17,17,.82) 22%,rgba(17,17,17,.2) 58%,transparent 80%),linear-gradient(0deg,rgba(17,17,17,.7),transparent 35%)}
.slide-text{position:relative;z-index:2;padding-left:max(16px,env(safe-area-inset-left,0px));text-shadow:0 2px 14px rgba(0,0,0,.7)}
.kicker{font-family:var(--script);color:#a5d86f;font-size:27px;line-height:1}
.slide h1,.slide h2{font-family:var(--display);font-weight:400;line-height:.88;letter-spacing:.5px;margin-top:6px}
.slide .l1{display:block;font-size:clamp(56px,15vw,100px);color:#fff}
.slide .l2{display:block;font-size:clamp(42px,11vw,78px);color:var(--red)}
.slide p{margin:12px 0 16px;color:#eee;font-size:14px;max-width:22ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:24px;font-weight:700;letter-spacing:.3px;text-align:center}
.btn-red{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(227,38,43,.35)}
.btn-red:hover{background:var(--red-d)}
.btn-red .arr{width:22px;height:22px;border-radius:50%;background:#fff;color:var(--red);display:inline-flex;align-items:center;justify-content:center;flex:none}
.btn-red .arr svg{width:14px;height:14px}
.btn-ghost{border:1.5px solid var(--line);background:#fff;color:var(--text)}
.btn-wa{background:var(--wa);color:#fff}
.btn-block{width:100%}
.dots{position:absolute;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3}
.dots button{width:8px;height:8px;border-radius:5px;background:#666;transition:.3s}
.dots button.on{width:22px;background:var(--red)}

/* Catégories et cartes */
.cats{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;width:68px;font-size:13px;font-weight:500;color:#333}
.cat .ring{width:64px;height:64px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.05);overflow:hidden;transition:.2s}
.cat .ring svg{width:28px;height:28px}
.cat .ring img{width:100%;height:100%;object-fit:cover}
.cat:hover .ring{border-color:var(--red);transform:translateY(-2px)}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 10px}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 min(46%,220px);scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .2s;position:relative}
.card:hover{transform:translateY(-3px)}
.card .media{position:relative;aspect-ratio:1.45;background:#2a1d15;overflow:hidden}
.card .media img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:0;left:0;padding:4px 10px;border-radius:0 0 12px 0;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:#fff;text-transform:uppercase}
.tag.red{background:var(--red)}.tag.green{background:#5e9d2f}.tag.gold{background:#d99a0b}.tag.dark{background:#333}
.card .body{padding:11px 12px 12px;display:flex;flex-direction:column;flex:1;min-width:0}
.card h3{font-size:15px;font-weight:700;line-height:1.25}
.card h3 a::after{content:"";position:absolute;inset:0}
.card .desc{font-size:12px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:6px}
.meta svg{width:14px;height:14px;color:var(--red)}
.foot{display:flex;align-items:flex-end;justify-content:space-between;margin-top:auto;padding-top:8px;gap:6px}
.price{font-weight:700;font-size:16px;white-space:nowrap}
.price small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;line-height:1}
.plus{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;position:relative;z-index:2}
.plus svg{width:18px;height:18px}

.promo{position:relative;background:var(--dark);color:#fff;border-radius:var(--radius);overflow:hidden;min-height:170px;display:flex;align-items:center;border:2px solid #2c2c2c}
.promo .bgimg{position:absolute;top:0;right:0;bottom:0;width:62%;background-size:cover;background-position:center;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.promo .txt{padding:18px;position:relative;z-index:2;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.promo .k{color:#a5d86f;font-weight:700;font-size:12px;letter-spacing:1.2px}
.promo .big{font-family:var(--display);font-size:46px;line-height:.9;margin:4px 0 2px}
.promo .s{font-family:var(--display);font-size:22px;line-height:1}
.promo .code{display:inline-block;margin:8px 0 10px;font-size:12px;color:#ddd}
.promo .code b{color:#fff;border:1px dashed #888;padding:2px 7px;border-radius:6px;letter-spacing:1px}
.promo .btn{min-height:38px;font-size:13px;padding:0 14px}
.promo .circle{position:absolute;right:14px;top:14px;width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;line-height:1;z-index:2;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.promo .circle b{font-size:22px}.promo .circle small{font-size:11px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:20px;background:#fff;border:1px solid var(--line);font-weight:500;font-size:13px}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-size:44px;margin-bottom:6px}
.why{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.why div{background:#fff;border-radius:14px;padding:14px;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);min-width:0}
.why svg{width:26px;height:26px;color:var(--red);flex:none}
.why b{display:block;font-size:13.5px}
.why span{font-size:12px;color:var(--muted)}

/* Fiche produit */
.p-hero{position:relative;background:var(--dark)}
.p-hero img{width:100%;max-height:420px;object-fit:cover;aspect-ratio:1.45}
.p-hero .back{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.55)}
.p-card{background:#fff;border-radius:22px 22px 0 0;margin-top:-22px;position:relative;padding-block:20px 10px}
.p-title{font-size:24px;font-weight:700;line-height:1.2}
.p-desc{color:var(--muted);margin:6px 0 4px}
.group{margin-top:18px}
.group h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.group h3 small{color:var(--muted);font-weight:500}
.opts{display:grid;gap:8px}
.opts.sizes{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative}
.opt input{position:absolute;opacity:0}
.opt label{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;font-weight:500;transition:.15s;background:#fff}
.opts.sizes .opt label{flex-direction:column;justify-content:center;text-align:center;gap:2px;padding:10px 4px}
.opts.sizes .opt label small{color:var(--muted);font-size:11px}
.opt input:checked+label{border-color:var(--red);background:var(--red-l)}
.opt input:focus-visible+label{outline:3px solid var(--gold)}
.opt .pr{font-weight:700;font-size:13.5px;white-space:nowrap}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:24px;height:46px;background:#fff;flex:none}
.qty button{width:44px;height:44px;font-size:22px;font-weight:600}
.qty span{min-width:26px;text-align:center;font-weight:700}
.stickybar{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line);padding-block:12px;margin-top:20px;z-index:20;box-shadow:0 -8px 20px rgba(0,0,0,.05)}
.addbar{display:flex;gap:10px;align-items:center}
.addbar .btn{flex:1}

/* Panier et commande */
.line{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.line .thumb{width:66px;height:66px;border-radius:14px;flex:none;overflow:hidden;background:#2a1d15}
.line .thumb img{width:100%;height:100%;object-fit:cover}
.line .info{flex:1;min-width:0}
.line .info b{display:block;font-size:14.5px}
.line .info small{display:block;color:var(--muted);font-size:12px}
.line .qty{height:36px}.line .qty button{width:34px;height:34px;font-size:18px}
.box{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.sum{background:#f7f6f4;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.sum .tot{border-top:1px solid #e3e0dc;margin-top:6px;padding-top:9px;font-weight:700;font-size:17px}
.sum .disc{color:#2f7d14}
.promo-in{display:flex;gap:8px;margin-top:14px}
.clear-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:4px}
.btn-clear{display:inline-flex;align-items:center;gap:6px;color:var(--red);font-weight:600;font-size:13.5px;padding:8px 12px;border-radius:20px;border:1.5px solid #f3c2c3;background:#fff}
.btn-clear svg{width:16px;height:16px}
.btn-clear:hover{background:var(--red-l)}
.confirm-clear{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;font-weight:600}
.confirm-clear .yes{background:var(--red);color:#fff;border-radius:20px;padding:8px 14px}
.confirm-clear .no{border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;background:#fff}
.promo-in input{flex:1;min-width:0}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field span em{font-weight:400;color:var(--muted);font-style:normal}
.input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 13px;background:#fff;font-size:16px}
.input:focus{outline:none;border-color:var(--red)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes .opt label{flex-direction:column;align-items:flex-start;gap:2px}
.modes .opt label small{color:var(--muted);font-weight:400;font-size:12px}
.err{background:#fde8e8;color:#a3161a;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13.5px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.receipt-layout{display:grid;gap:16px}
.steps{list-style:none;display:grid;gap:16px;margin-top:12px;counter-reset:s}
.steps li{display:grid;gap:8px}
.steps li span{font-size:13px;color:var(--muted)}
.receipt-wrap{background:#e9e6e2;border-radius:var(--radius);padding:14px}
.receipt-wrap img{width:100%;max-width:440px;margin:0 auto;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#fff;min-height:200px}
@media (min-width:860px){.receipt-layout{grid-template-columns:1fr 1fr;align-items:start}}
.hist{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:13.5px;background:#fff}
.hist b{display:block}
.info-list{display:grid;gap:10px}
.info-list .box{display:flex;gap:12px;align-items:flex-start}
.info-list svg{width:24px;height:24px;color:var(--red);flex:none;margin-top:2px}
.zones{columns:2;column-gap:16px;font-size:13px;margin-top:6px}
.zones li{list-style:none;display:flex;justify-content:space-between;gap:6px;padding:3px 0;break-inside:avoid;border-bottom:1px dashed var(--line)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:#e9f5dc;color:#3d7a14}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.closed{background:#fde8e8;color:#a3161a}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--dark);color:#fff;padding:11px 18px;border-radius:24px;font-weight:600;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Barre du bas : le bouton de la page active monte en rouge */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;border-top:1px solid var(--line);padding:8px max(6px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -6px 20px rgba(0,0,0,.06);height:calc(76px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:11px;font-weight:500;color:#666;position:relative}
.tab .bubble{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;border:4px solid transparent;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .3s,box-shadow .3s,border-color .3s}
.tab .bubble svg{width:23px;height:23px;transition:transform .3s}
.tab .lbl{transition:color .3s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.tab.on{color:var(--red)}
.tab.on .bubble{background:var(--red);color:#fff;border-color:#fff;transform:translateY(-24px) scale(1.28);box-shadow:0 10px 22px rgba(227,38,43,.45)}
.tab.on .bubble svg{transform:scale(.92)}
.tab.on .lbl{font-weight:700;transform:translateY(-14px)}
.tab .badge{top:-4px;right:-6px;border-color:#fff;background:var(--dark)}
.tab.on .badge{background:var(--dark)}

footer{background:var(--dark);color:#bbb;padding-block:28px 26px;margin-top:24px;font-size:13px}
footer .cols{display:grid;gap:18px}
footer h3{color:#fff;font-size:14px;margin-bottom:6px}
footer a{color:#ddd;text-decoration:underline;text-underline-offset:2px}
footer .copy{border-top:1px solid #2a2a2a;margin-top:18px;padding-top:14px;font-size:12px;color:#888}

@media (min-width:640px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row .card{flex-basis:230px}
  .why{grid-template-columns:repeat(4,minmax(0,1fr))}
  .slide{min-height:380px}
  .slide p{font-size:15px;max-width:28ch}
  footer .cols{grid-template-columns:repeat(3,1fr)}
  .p-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start;padding-block:24px}
  .p-layout .p-hero img{border-radius:22px;max-height:none}
  .p-layout .p-card{margin-top:0;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
  .p-layout .p-hero .back{left:12px}
  .zones{columns:3}
}
@media (min-width:960px){
  body{padding-bottom:0}
  .tabbar{display:none}
  .nav-links{display:flex}
  .search-row{max-width:620px;margin:0 auto}
  .slide{min-height:460px}
  .slide-text{padding-left:max(24px,calc((100vw - 1180px) / 2 + 16px))}
  .slide-photo{width:62%}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  .row{overflow:visible;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  .row .card:nth-child(n+5){display:none}
  .promo{min-height:220px}.promo .big{font-size:68px}.promo .s{font-size:30px}
  .promo .circle{width:86px;height:86px;right:30px}.promo .circle b{font-size:30px}
  .stickybar{bottom:0}
  .toast{bottom:30px}
  .page-head h1{font-size:56px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Navigation entre les pages ---------- */
function currentRoute() { return (location.hash || "#accueil").slice(1) || "accueil"; }
function render() {
  const r = currentRoute();
  let html, tab = r, title = brand();
  if (r === "accueil") { html = pageAccueil(); }
  else if (r === "menu") { html = pageMenu(); title = `Menu · ${brand()}`; }
  else if (r.startsWith("produit-")) { html = pageProduit(r.slice(8)); tab = "menu"; title = `${byId(r.slice(8))?.nom || "Produit"} · ${brand()}`; }
  else if (r === "panier") { html = pagePanier(); title = `Panier · ${brand()}`; }
  else if (r === "commande") { html = pageCommande(); tab = "panier"; title = `Commande · ${brand()}`; }
  else if (r === "offres") { html = pageOffres(); title = `Offres · ${brand()}`; }
  else if (r === "plus") { html = pagePlus(); title = `Infos · ${brand()}`; }
  else { html = pageIntrouvable(); tab = ""; }
  const app = $("#app");
  app.innerHTML = `<div class="page">${html}</div>`;
  document.title = title;
  $("#searchRow").hidden = !(r === "accueil" || r === "menu");
  document.querySelectorAll("[data-tab]").forEach(a => { const on = a.dataset.tab === tab; a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (r === "menu") updateMenuCount();
  if (r === "accueil") { goSlide(0); autoplay(); } else clearInterval(timer);
  if (r === "commande" && lastOrder) drawReceipt();
  updateCount();
  scrollTo({ top: 0 });
}
function updateMenuCount() { const n = filtered().length; const e = $("#menuCount"); if (e) e.textContent = `${n} article${n > 1 ? "s" : ""}${query ? ` pour « ${query} »` : ""}`; }
window.addEventListener("hashchange", render);

/* ---------- Carrousel ---------- */
function goSlide(i) {
  const s = $("#slides"); if (!s) return;
  const n = CONFIG.bannieres.length; slide = (i + n) % n;
  s.style.transform = `translateX(-${slide * 100}%)`;
  document.querySelectorAll("[data-dot]").forEach((d, k) => d.classList.toggle("on", k === slide));
}
function autoplay() { clearInterval(timer); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) timer = setInterval(() => !document.hidden && goSlide(slide + 1), 5000); }
let touchX = null;
document.addEventListener("touchstart", e => { if (e.target.closest("#slides")) touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 40) { goSlide(slide + (dx < 0 ? 1 : -1)); autoplay(); } touchX = null; });

/* ---------- Commande ---------- */
function readCheckout() {
  const v = s => ($(s) ? $(s).value.trim() : "");
  customer = { name: v("#cName"), phone: v("#cPhone") };
  if ($("#cAdresse")) { co.adresse = v("#cAdresse"); co.precision = v("#cPrecision"); }
  if ($("#cPay")) co.paiement = $("#cPay").value;
}
function sendOrder() {
  readCheckout();
  const err = m => { const e = $("#cErr"); e.textContent = m; e.hidden = false; e.scrollIntoView({ behavior: "smooth", block: "center" }); };
  if (customer.name.length < 2) return err("Indiquez votre nom.");
  if (customer.phone.replace(/\D/g, "").length < 8) return err("Indiquez un numéro de téléphone valide.");
  if (co.mode === "livraison") {
    if (!co.ville) return err("Choisissez votre ville.");
    if (!co.quartier) return err("Choisissez votre quartier.");
    if (co.adresse.length < 3) return err("Indiquez une adresse ou un point de repère.");
  }
  const f = fee(), d = discount(), total = subtotal() - d + f.price;
  const now = new Date();
  const ymd = new Intl.DateTimeFormat("fr-CA", { timeZone: "Africa/Douala", year: "2-digit", month: "2-digit", day: "2-digit" }).format(now).replace(/-/g, "");
  const num = `MP-${ymd}-${String(Math.floor(1000 + Math.random() * 9000))}`;
  let msg = `Bonjour ${brand()} 🍕, je souhaite commander :\n*Commande ${num}*\n\n`;
  msg += cart.map(l => { const { name, detail } = lineLabel(l); return `• ${l.qty} × ${name}${detail ? ` (${detail})` : ""} — ${fcfa(lineTotal(l))}`; }).join("\n");
  msg += `\n\nSous-total : ${fcfa(subtotal())}`;
  if (d) msg += `\nPromo ${CONFIG.promo.code} : −${fcfa(d)}`;
  msg += co.mode === "retrait" ? `\nRetrait sur place : gratuit` : `\nLivraison (${co.quartier}, ${co.ville}) : ${fcfa(f.price)}`;
  msg += `\n*TOTAL : ${fcfa(total)}*\n\nNom : ${customer.name}\nTéléphone : ${customer.phone}`;
  if (co.mode === "livraison") { msg += `\nVille : ${co.ville}\nQuartier : ${co.quartier}\nAdresse : ${co.adresse}`; if (co.precision) msg += `\nPrécision : ${co.precision}`; }
  else msg += `\nRetrait : ${CONFIG.adresseRetrait}`;
  msg += `\nPaiement : ${co.paiement}`;
  save("pz_customer", customer);
  orders.unshift({ date: new Date().toISOString(), lines: cart.map(l => ({ ...l })), total });
  orders = orders.slice(0, 20); save("pz_orders", orders);
  lastOrder = {
    num, date: now.toISOString(), total, sub: subtotal(), disc: d, fee: f.price, mode: co.mode, ville: co.ville, quartier: co.quartier,
    adresse: co.adresse, precision: co.precision, paiement: co.paiement, client: { ...customer },
    lines: cart.map(l => ({ ...lineLabel(l), qty: l.qty, amount: lineTotal(l) })),
    text: msg,
    url: `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`
  };
  orders[0].num = num;
  cart = []; save("pz_cart", cart); co.promo = "";
  render();
}

/* ---------- Reçu (image) ---------- */
let receiptCanvas = null;
function loadImg(src) { return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
function wrapText(ctx, text, maxW) {
  const words = String(text).split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function drawStamp(ctx, cx, cy, r, dateTxt) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.21);
  const ink = "rgba(196,22,40,.82)";
  ctx.strokeStyle = ink; ctx.fillStyle = ink;
  ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, r - 14, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, r - 62, 0, Math.PI * 2); ctx.stroke();
  const ring = `${brand()} ★ ${CONFIG.adresseRetrait.toUpperCase()} ★ `;
  ctx.font = `700 ${Math.min(25, Math.floor((2 * Math.PI * (r - 38)) / ring.length / 0.82))}px Poppins, Arial, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const step = (Math.PI * 2) / ring.length;
  [...ring].forEach((ch, i) => { ctx.save(); ctx.rotate(i * step); ctx.translate(0, -(r - 38)); ctx.fillText(ch, 0, 0); ctx.restore(); });
  const maxW = (r - 62) * 2 - 26;
  const fit = (txt, size, family) => { let f = size; do { ctx.font = `700 ${f}px ${family}`; f -= 1; } while (ctx.measureText(txt).width > maxW && f > 10); };
  fit("COMMANDE", 38, "'Bebas Neue', Impact, Arial, sans-serif"); ctx.fillText("COMMANDE", 0, -20);
  fit("ENREGISTRÉE", 38, "'Bebas Neue', Impact, Arial, sans-serif"); ctx.fillText("ENREGISTRÉE", 0, 16);
  ctx.font = "600 17px Poppins, Arial, sans-serif"; ctx.fillText(dateTxt, 0, 50);
  ctx.restore();
}
async function drawReceipt() {
  const o = lastOrder; if (!o) return;
  try { await document.fonts?.ready; } catch {}
  const W = 1080, PAD = 80, logo = await loadImg(LOGO);
  const fmtDate = new Intl.DateTimeFormat("fr-FR", { dateStyle: "long", timeStyle: "short", timeZone: "Africa/Douala" }).format(new Date(o.date));
  const shortDate = new Intl.DateTimeFormat("fr-FR", { dateStyle: "short", timeZone: "Africa/Douala" }).format(new Date(o.date));
  // 1) mesure de la hauteur, 2) dessin
  const draw = (ctx, measureOnly) => {
    let y = 70;
    const T = (txt, x, size, weight = 400, color = "#151515", align = "left", font = "Poppins, Arial, sans-serif") => {
      if (!measureOnly) { ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(txt, x, y); }
    };
    const rule = (dash) => { if (!measureOnly) { ctx.strokeStyle = "#d9d4ce"; ctx.lineWidth = 2; ctx.setLineDash(dash ? [10, 8] : []); ctx.beginPath(); ctx.moveTo(PAD, y); ctx.lineTo(W - PAD, y); ctx.stroke(); ctx.setLineDash([]); } };
    if (logo && !measureOnly) { ctx.save(); ctx.beginPath(); ctx.arc(W / 2, y + 130, 130, 0, Math.PI * 2); ctx.clip(); ctx.drawImage(logo, W / 2 - 130, y, 260, 260); ctx.restore(); }
    y += 330;
    T("BON DE COMMANDE", W / 2, 52, 400, "#151515", "center", "'Bebas Neue', Impact, sans-serif"); y += 46;
    T(`N° ${o.num}`, W / 2, 30, 700, "#e3262b", "center"); y += 40;
    T(fmtDate, W / 2, 24, 400, "#6b6b6b", "center"); y += 40;
    rule(true); y += 50;
    const info = [["Client", o.client.name], ["Téléphone", o.client.phone], ["Réception", o.mode === "retrait" ? `Retrait sur place — ${CONFIG.adresseRetrait}` : `Livraison — ${o.quartier}, ${o.ville}`]];
    if (o.mode === "livraison") info.push(["Adresse", o.adresse + (o.precision ? ` (${o.precision})` : "")]);
    info.push(["Paiement", o.paiement]);
    ctx.font = "400 26px Poppins, Arial, sans-serif";
    for (const [k, v] of info) {
      T(k, PAD, 24, 600, "#6b6b6b");
      const ls = wrapText(ctx, v, W - PAD * 2 - 230);
      ls.forEach((l, i) => { if (!measureOnly) { ctx.font = "500 26px Poppins, Arial, sans-serif"; ctx.fillStyle = "#151515"; ctx.textAlign = "left"; ctx.fillText(l, PAD + 230, y); } if (i < ls.length - 1) y += 36; });
      y += 44;
    }
    y += 6; rule(false); y += 46;
    T("ARTICLE", PAD, 22, 700, "#6b6b6b"); T("MONTANT", W - PAD, 22, 700, "#6b6b6b", "right"); y += 22; rule(false); y += 46;
    for (const l of o.lines) {
      T(`${l.qty} × ${l.name}`, PAD, 28, 600); T(fcfa(l.amount), W - PAD, 28, 600, "#151515", "right"); y += 34;
      if (l.detail) { ctx.font = "400 22px Poppins, Arial, sans-serif"; for (const dl of wrapText(ctx, l.detail, W - PAD * 2 - 220)) { T(dl, PAD + 34, 22, 400, "#6b6b6b"); y += 30; } }
      y += 18;
    }
    rule(true); y += 46;
    const tot = [["Sous-total", fcfa(o.sub)]];
    if (o.disc) tot.push([`Promo ${CONFIG.promo.code}`, "−" + fcfa(o.disc)]);
    tot.push([o.mode === "retrait" ? "Retrait sur place" : "Livraison", o.fee ? fcfa(o.fee) : "Gratuit"]);
    for (const [k, v] of tot) { T(k, PAD, 26, 400, "#444"); T(v, W - PAD, 26, 500, "#151515", "right"); y += 42; }
    y += 34;
    if (!measureOnly) { ctx.fillStyle = "#111"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(PAD, y - 46, W - PAD * 2, 74, 14) : ctx.rect(PAD, y - 46, W - PAD * 2, 74); ctx.fill(); }
    T("TOTAL À PAYER", PAD + 26, 30, 700, "#ffffff"); T(fcfa(o.total), W - PAD - 26, 34, 700, "#f5b81c", "right"); y += 90;
    T("Commande en attente de confirmation par la boutique.", PAD, 22, 400, "#6b6b6b"); y += 32;
    T("Le paiement se fait à la livraison ou au retrait.", PAD, 22, 400, "#6b6b6b"); y += 70;
    const stampY = y + 120;
    if (!measureOnly) drawStamp(ctx, W - PAD - 170, stampY, 165, shortDate);
    T("Merci pour votre commande !", PAD, 34, 400, "#151515", "left", "Caveat, 'Brush Script MT', cursive"); y += 50;
    T(brand(), PAD, 26, 700); y += 36;
    T(CONFIG.adresseRetrait, PAD, 22, 400, "#444"); y += 32;
    T(`Tél. / WhatsApp : ${CONFIG.telephone}`, PAD, 22, 400, "#444"); y += 32;
    T(CONFIG.slogan, PAD, 22, 400, "#444"); y = Math.max(y, stampY + 170) + 40;
    if (!measureOnly) { ctx.fillStyle = "#007a3d"; ctx.fillRect(0, y - 14, W / 3, 14); ctx.fillStyle = "#ce1126"; ctx.fillRect(W / 3, y - 14, W / 3, 14); ctx.fillStyle = "#fcd116"; ctx.fillRect(2 * W / 3, y - 14, W / 3, 14); }
    return y;
  };
  const tmp = document.createElement("canvas").getContext("2d");
  const H = draw(tmp, true);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H); ctx.textBaseline = "alphabetic";
  draw(ctx, false);

}
let receiptFile = null;
async function prepareReceiptFile() {

  receiptFile = blob ? new File([blob], `facture-mboa-pizza-${lastOrder.num}.png`, { type: "image/png" }) : null;

// Téléchargement de la facture (image PNG).
async function downloadReceipt() {
  const note = $("#dlNote");
  const show = msg => { if (note) { note.innerHTML = msg; note.hidden = false; } };
  if (!receiptFile) await prepareReceiptFile();
  if (!receiptFile) return show("La facture n'est pas encore prête, réessayez dans un instant.");
  // Dans l'aperçu Claude, le téléchargement passe par la fenêtre de confirmation de Claude.
  if (window.claude && typeof window.claude.use === "function") {
    const dl = await window.claude.use("downloads").catch(() => null);
    if (dl) {
      try { await dl.save({ filename: receiptFile.name, data: receiptFile }); show("✅ Facture téléchargée."); }
      catch (err) { if (!err || err.code !== "declined") show("Le téléchargement n'est pas disponible ici : faites un appui long sur la facture pour l'enregistrer."); }
      return;
    }
  }
  // Sur le vrai site (Vercel) : téléchargement direct du fichier.
  const url = URL.createObjectURL(receiptFile);
  const a = document.createElement("a");
  a.href = url; a.download = receiptFile.name; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  show("✅ Facture téléchargée. Sur iPhone, si elle s'ouvre à l'écran, appuyez sur Partager puis « Enregistrer l'image ».");
}

/* ---------- Événements ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-download-receipt],[data-clear],[data-quick],[data-setcat],[data-chip],[data-sort],[data-dot],[data-q],[data-cq],[data-reorder],[data-reset-order],#addBtn,#sendOrder,#applyPromo,#sortBtn");
  if (!t) return;
  const d = t.dataset;
  if (d.clear === "ask") { $("#clearRow").innerHTML = `<div class="confirm-clear" role="alert">Vider tout le panier ? <button class="yes" type="button" data-clear="yes">Oui, vider</button><button class="no" type="button" data-clear="no">Annuler</button></div>`; $("#clearRow .no").focus(); return; }
  if (d.clear === "no") { $("#clearRow").outerHTML = clearCartHTML(); return; }
  if (d.clear === "yes") { cart = []; co.promo = ""; save("pz_cart", cart); toast("Panier vidé"); if (currentRoute() === "panier") render(); else location.hash = "#panier"; return; }
  if (d.quick) { const p = byId(d.quick); if (typeof p.prix === "number" && !p.menu) addToCart(p.id, null, [], 1); else location.hash = "#produit-" + p.id; return; }
  if (d.setcat) { cat = d.setcat; query = ""; $("#q").value = ""; if (currentRoute() === "menu") render(); return; }
  if (d.chip) { cat = d.chip; render(); return; }
  if (d.sort) { sort = d.sort; render(); return; }
  if (d.dot) { goSlide(+d.dot); autoplay(); return; }
  if (d.q) { pick.qty = Math.max(1, Math.min(50, pick.qty + +d.q)); $("#pQty").textContent = pick.qty; $("#pTotal").textContent = fcfa(unitPrice(byId(pick.id), pick.size, pick.extras) * pick.qty); return; }
  if (d.cq !== undefined) { const l = cart[+d.cq]; l.qty += +d.d; if (l.qty <= 0) cart.splice(+d.cq, 1); save("pz_cart", cart); render(); return; }
  if (d.reorder) { orders[+d.reorder].lines.filter(l => byId(l.id)).forEach(l => addToCart(l.id, l.size, l.extras, l.qty, l.note)); location.hash = "#panier"; return; }
  if (d.resetOrder !== undefined) { lastOrder = null; return; }
  if (t.id === "addBtn") { addToCart(pick.id, pick.size, pick.extras, pick.qty, ($("#pNote")?.value || "").trim().slice(0, 120)); return; }
  if (t.id === "applyPromo") { co.promo = $("#promoCode").value.trim(); render(); if (discount()) toast("Code promo appliqué ✓"); return; }
  if (t.id === "sendOrder") { sendOrder(); return; }
  if (d.downloadReceipt !== undefined) { downloadReceipt(); return; }
  if (t.id === "sortBtn") { sort = sort === "asc" ? "desc" : sort === "desc" ? "default" : "asc"; toast({ asc: "Tri : prix croissant", desc: "Tri : prix décroissant", default: "Tri : recommandé" }[sort]); if (currentRoute() === "menu") render(); else location.hash = "#menu"; return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.name === "size" || t.name === "extra") {
    pick.size = document.querySelector("input[name=size]:checked")?.value || pick.size;
    pick.extras = [...document.querySelectorAll("input[name=extra]:checked")].map(x => +x.value);
    $("#pTotal").textContent = fcfa(unitPrice(byId(pick.id), pick.size, pick.extras) * pick.qty);
  }
  if (t.name === "mode") { readCheckout(); co.mode = t.value; render(); }
  if (t.id === "cVille") { readCheckout(); co.ville = t.value; co.quartier = ""; render(); $("#cQuartier")?.focus(); }
  if (t.id === "cQuartier") { readCheckout(); co.quartier = t.value; render(); }
});
let qTimer;
$("#q").addEventListener("input", e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    query = e.target.value.trim().slice(0, 60);
    if (query) cat = "all";
    if (currentRoute() !== "menu") { location.hash = "#menu"; return; }
    $("#grid").innerHTML = menuGrid(); updateMenuCount();
    document.querySelectorAll("[data-chip]").forEach(c => c.classList.toggle("on", c.dataset.chip === cat));
  }, 200);
});
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") e.target.blur(); });

/* ---------- Démarrage ---------- */
$("#logo").innerHTML = `<img src="${LOGO}" alt="" width="54" height="54"><span><b>${esc(CONFIG.nom1)} <span>${esc(CONFIG.nom2)}</span></b><small>${esc(CONFIG.slogan)}</small></span>`;
$("#navLinks").innerHTML = TABS.map(([k, l]) => `<a href="#${k}" data-tab="${k}">${k === "panier" ? "Panier" : l}</a>`).join("");
$("#tabbar").innerHTML = TABS.map(([k, l, ic]) => `<a class="tab" href="#${k}" data-tab="${k}"><span class="bubble">${ICON[ic]}${k === "panier" ? '<span class="badge" data-count hidden>0</span>' : ""}</span><span class="lbl">${l}</span></a>`).join("");
$("#footCols").innerHTML = `
  <div><img class="foot-logo" src="${LOGO}" alt="Logo ${esc(brand())}"><h3>${esc(brand())}</h3><p>Pizzas préparées à la commande et jus 100 % naturels, livrés à ${Object.keys(CONFIG.livraison).join(" et ")}.</p></div>
  <div><h3>Horaires</h3><p>Tous les jours de ${CONFIG.horaires.ouverture} à ${CONFIG.horaires.fermeture}</p></div>
  <div><h3>Contact</h3><p>📞 ${esc(CONFIG.telephone)}<br>📍 ${esc(CONFIG.adresseRetrait)}<br><a href="https://wa.me/${CONFIG.whatsapp}" target="_blank" rel="noopener">Écrire sur WhatsApp</a></p></div>`;
$("#copy").textContent = `© ${new Date().getFullYear()} ${brand()}. Photos non contractuelles.`;
{ const l = document.createElement("link"); l.rel = "icon"; l.href = LOGO_ICON; document.head.appendChild(l); }
render();
</script>
